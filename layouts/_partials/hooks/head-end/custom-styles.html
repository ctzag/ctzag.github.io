<style>
/* =============================================================================
   CUSTOM CSS - DR. CHRISTOS TZAGKARAKIS
   Fixed version with correct selectors for Hugo Blox v2
   ============================================================================= */

/* -----------------------------------------------------------------------------
   1. NAME - Keep on one line with adjusted size to prevent overlap
   ----------------------------------------------------------------------------- */
/* Target the name heading in the author profile */
.hb-section-author h1,
section[id^="about"] h1,
.prose h1:first-of-type {
  white-space: nowrap !important;
  font-size: 2rem !important;  /* Slightly smaller to fit */
  line-height: 1.2 !important;
}

/* If you prefer TWO lines (cleaner look), comment out above and use this: */
/*
.hb-section-author h1 {
  white-space: normal !important;
}
*/

/* -----------------------------------------------------------------------------
   2. EDUCATION - Force 2x2 grid
   ----------------------------------------------------------------------------- */
/* Target ALL grid containers and force 2 columns */
.hb-section-education .grid,
.hb-section-education > div > div,
section[id^="education"] .grid,
[class*="education"] .grid {
  display: grid !important;
  grid-template-columns: repeat(2, 1fr) !important;
  gap: 1rem !important;
}

/* More aggressive: target any 3-column grid inside the main content */
main .grid.sm\:grid-cols-2.lg\:grid-cols-3,
.grid.lg\:grid-cols-3 {
  grid-template-columns: repeat(2, 1fr) !important;
}

/* Force the education cards container specifically */
.mt-6.grid {
  grid-template-columns: repeat(2, 1fr) !important;
}

/* -----------------------------------------------------------------------------
   3. INTERESTS - Force single row
   ----------------------------------------------------------------------------- */
/* Target the interests badges container */
.hb-section-interests .flex,
section[id^="interests"] .flex,
[class*="interests"] .flex.flex-wrap {
  display: flex !important;
  flex-wrap: nowrap !important;
  justify-content: center !important;
  gap: 0.5rem !important;
}

/* More aggressive selector for flex-wrap containers with gap-2 */
.mt-4.flex.flex-wrap.gap-2,
.flex.flex-wrap.justify-center.gap-2 {
  flex-wrap: nowrap !important;
}

/* -----------------------------------------------------------------------------
   4. MOBILE RESPONSIVE
   ----------------------------------------------------------------------------- */
@media (max-width: 768px) {
  /* Allow name to wrap on mobile */
  .hb-section-author h1,
  section[id^="about"] h1 {
    white-space: normal !important;
    font-size: 1.75rem !important;
  }
  
  /* Stack education to 1 column on mobile */
  .hb-section-education .grid,
  .mt-6.grid,
  .grid.lg\:grid-cols-3 {
    grid-template-columns: 1fr !important;
  }
  
  /* Allow interests to wrap on mobile */
  .hb-section-interests .flex,
  .mt-4.flex.flex-wrap.gap-2 {
    flex-wrap: wrap !important;
  }
}

/* -----------------------------------------------------------------------------
   5. SUBTLE IMPROVEMENTS
   ----------------------------------------------------------------------------- */
/* Education card hover effect */
.rounded-xl {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.rounded-xl:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
}

.btn-secondary-ct {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  margin: 0.5rem 0.75rem 0.5rem 0;
  padding: 0.7rem 1.5rem;
  border: 1.5px solid #1d4ed8;
  border-radius: 0.5rem;
  background-color: rgba(29, 78, 216, 0.04);
  color: #1d4ed8;
  font-weight: 600;
  font-size: 1rem;
  text-decoration: none;
  transition: all 0.2s ease;
}
.btn-secondary-ct:hover {
  background-color: #1d4ed8;
  color: #ffffff;
  text-decoration: none;
}
.btn-secondary-ct .arrow { transition: transform 0.2s ease; }
.btn-secondary-ct:hover .arrow { transform: translateX(3px); }

/* --- My Research section --- */
.research-section h3 {
  font-size: 1.4rem;
  font-weight: 600;
  margin-top: 2rem;
  margin-bottom: 0.75rem;
  padding: 0.5rem 0.85rem;
  background-color: #f1f5f9;
  border-left: 3px solid #64748b;
  border-radius: 0 0.25rem 0.25rem 0;
  line-height: 1.3;
}
.research-section p {
  padding-left: 0.85rem;
}

/* --- Reduce gap under collection block titles --- */
#papers .flex.flex-col.items-center > .mt-16,
#patents .flex.flex-col.items-center > .mt-16 {
  margin-top: 0.75rem !important;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  if (!window.location.pathname.startsWith('/experience')) return;
  var headings = document.querySelectorAll('h1, h2, h3');
  for (var i = 0; i < headings.length; i++) {
    if (headings[i].textContent.trim() === 'Education') {
      headings[i].id = 'education';
      if (window.location.hash === '#education') {
        headings[i].scrollIntoView();
      }
      break;
    }
  }
});
</script>
